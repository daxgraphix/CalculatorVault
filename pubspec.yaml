name: calculator_vault
description: "Calculator Vault — offline-first calculator with an encrypted private vault."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management / navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Local storage (no build_runner — hand-written TypeAdapters)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # Crypto: Argon2id KDF + AES-256-GCM (same approach as SafeText)
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2

  # File / media handling
  file_picker: ^8.0.6
  image_picker: ^1.1.2
  video_player: ^2.9.1
  photo_view: ^0.15.0
  just_audio: ^0.9.40

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  share_plus: ^9.0.0
  open_filex: ^4.5.0
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
